  <rect x="26" y="26" width="460" height="460" rx="92" fill="#FFFFFF" stroke="#211b22" stroke-width="34" stroke-linejoin="round"/>
  
  <!-- 3D Lower Shelf / Shadow on White Keys -->
  <path d="M43 388 C 43 436, 74 469, 122 469 L 390 469 C 438 469, 469 436, 469 388 L 469 414 C 469 458, 432 470, 390 470 L 122 470 C 80 470, 43 458, 43 414 Z" fill="#b7b8bb"/>

  <!-- 3 Key Dividers (vertical dark lines from black keys to bottom edge) -->
