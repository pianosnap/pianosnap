  <line x1="256" y1="285" x2="256" y2="470" stroke="#211b22" stroke-width="16" stroke-linecap="square"/>
  <line x1="361" y1="285" x2="361" y2="470" stroke="#211b22" stroke-width="16" stroke-linecap="square"/>

  <!-- 3 Black Keys with rounded bottoms -->
  <rect x="115" y="40" width="72" height="248" rx="16" fill="#211b22"/>
  <rect x="220" y="40" width="72" height="248" rx="16" fill="#211b22"/>
  <rect x="325" y="40" width="72" height="248" rx="16" fill="#211b22"/>
